name: Publish to crates.io

# Manual github action for the publishing of Dogwood Local Engine to crates.io.
#
# Auth is Trusted Publishing over OIDC, so no API token is stored as a secret.
# The crate's config on crates.io must name this repository and this file,
# `publish.yml`, exactly. See https://crates.io/docs/trusted-publishing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (build, package and verify; no upload)"
        type: boolean
        default: true

permissions:
  id-token: write # mint the OIDC token crates.io exchanges for a registry token
  contents: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # Optional approval gate. Needs a `release` environment in repo settings AND
    # the same name in the crates.io config — the environment is part of the OIDC
    # claim, so a mismatch fails at token-minting time.
    # environment: release

    steps:
      # persist-credentials: false — token isn't used after checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      # Runs on every invocation, dry run included. Not redundant with ci.yml:
      # Cargo.lock is not committed, so dependency resolution floats and a
      # semver-compatible upstream release can land between the commit CI
      # validated and this publish. Default features only — the `shuttle` feature
      # replaces sync primitives with ones that require a Runner, so ordinary
      # tests must not be run with it enabled.
      - name: Test
        run: cargo test --workspace

      # `-p` because this is a virtual workspace: a bare `cargo publish` selects
      # ALL members, leaving it to `publish = false` on dogwood-server and
      # dogwood-performance to filter them back out.
      #
      # Builds from a clean packaged tarball, catching a file that `exclude` drops
      # but the build needs. Cannot catch an already-published version: that check
      # is server-side at upload, so the real publish below is the only check —
      # bump the version in dogwood-local-engine/Cargo.toml and re-run.
      - name: Verify build and packaging
        run: cargo publish -p dogwood-local-engine --dry-run

      # Pinned to a commit SHA rather than the `v1.0.5` tag or the moving `v1`
      # branch upstream documents: tags are mutable, and this step handles the
      # registry credential. The action revokes the token in a post step when the
      # job ends.
      #
      # To bump, resolve the new tag to its commit SHA — not the ref's object
      # SHA, which for an annotated tag is the tag object rather than the commit:
      #
      #   curl -s https://api.github.com/repos/rust-lang/crates-io-auth-action/commits/<tag> | jq -r .sha
      #
      # Keep the trailing `# <tag>` comment in sync so the pin stays readable.
      - name: Authenticate to crates.io (Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Publishing
      - name: Publish
        if: ${{ !inputs.dry_run }}
        id: publish
        run: cargo publish -p dogwood-local-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Branch on the input first. A bare `if:` has an implicit success(), so a
      # failure in any earlier step SKIPS the publish — indistinguishable from an
      # intentional dry run by `outcome` alone.
      - name: Summary
        if: ${{ always() }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run only — nothing was uploaded to crates.io."
          else
            case "${{ steps.publish.outcome }}" in
              success) echo "Published dogwood-local-engine to crates.io." ;;
              skipped) echo "Publish did not run (an earlier step failed) — nothing was uploaded." ;;
              *)       echo "Publish did not complete (${{ steps.publish.outcome }}) — nothing was uploaded." ;;
            esac
          fi >> "$GITHUB_STEP_SUMMARY"
